[project]
name = "auditor"
version = "0.1.0"
description = "Local English speech recognition and Russian subtitle server"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "faster-whisper>=1.1,<2",
    "ctranslate2>=4.5,<5",
    "sentencepiece>=0.2,<1",
    "huggingface-hub>=0.30,<2",
    "numpy>=2,<3",
]

[project.scripts]
auditor-server = "auditor_server.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
